[project]
name = "metamate-backend"
version = "2.0.0"
description = "AI-powered PDF data extraction API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "openai>=1.109.1",
    "pydantic>=2.13.4",
    "slowapi==0.1.10",
    "ruff==0.16.2",
    "pypdf>=6.15.0",
    "langchain-community>=0.4.2",
    "tiktoken>=0.13.0",
    "boto3>=1.43.69",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/services/llm_service.py" = ["E501"]
"evaluation/prompts.py" = ["E501"]
"evaluation/llm_judge.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eval = [
    "pandas>=3.0.5",
    "openpyxl>=3.1.0",
    "rouge-score>=0.1.2",
    "tqdm>=4.70.0",
    "google-genai>=1.0.0",
]
